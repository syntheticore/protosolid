 modeling, assemblies, simulation, CAM toolpaths and technical drawings.</p><h2 id="concepts">Core concepts</h2><p>A few ideas run through the entire application:</p><ul><li><strong>Parametric history.</strong> Every operation you perform is recorded as a feature in the <a href="#docs/history">timeline</a>. You can go back, change any feature, reorder or delete it, and the model is recomputed accordingly.</li><li><strong>Sketch-based modeling.</strong> Most shapes start as 2D <a href="#docs/sketching">sketches</a>, which are turned into 3D solids with features like Extrude or Revolve.</li><li><strong>Components.</strong> A document contains a tree of <a href="#docs/components">components</a>. Each component can hold its own solids, sketches and child components, so parts and assemblies live in the same document.</li><li><strong>Parameters.</strong> Numeric inputs accept <a href="#docs/parameters">expressions</a>, so a design can be driven by named parameters and adapt to new requirements.</li><li><strong>Exact geometry.</strong> ProtoSolid is built on Shapex, its own BREP modeling kernel written in Rust, with analytical surface definitions and STEP exchange.</li></ul><h2 id="installation">Installation</h2><p>Download ProtoSolid for your platform from the <a href="#download">download section</a>, install it and start the application. ProtoSolid is developed in the open on <a href="https://github.com/syntheticore/protosolid" target="_blank">GitHub</a>, where you can also build it from source.</p><h2 id="overview">Where to go next</h2><div class="cards"><a href="#docs/quick-start"><strong>Quick Start</strong>Model your first part in a few minutes.</a><a href="#docs/user-interface"><strong>User Interface</strong>Find your way around the window.</a><a href="#docs/sketching"><strong>Sketching</strong>Draw and constrain profiles.</a><a href="#docs/solid-features"><strong>Solid Features</strong>Turn sketches into solids.</a><a href="#docs/assemblies"><strong>Assemblies</strong>Join parts and test their motion.</a><a href="#docs/shortcuts"><strong>Keyboard Shortcuts</strong>Work faster with hot keys.</a></div>',9)]))}const lt=(t,e)=>{const n=t.__vccOpts||t;for(const[r,o]of e)n[r]=o;return n},d2={},u2=lt(d2,[["render",c2]]);function f2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Quick Start</h1><p class="lead">This walkthrough models a simple mounting plate with a hole and rounded corners. It touches the most important concepts of ProtoSolid in a few minutes.</p><h2 id="sketch">1. Draw a sketch</h2><ol><li>Press <kbd>S</kbd> to start a new sketch and click the <strong>XZ</strong> plane, which lies flat on the ground.</li><li>Press <kbd>R</kbd> for the rectangle tool. Click once, move the mouse, type <code>80</code> for the width, press <kbd>Tab</kbd>, type <code>50</code> for the height and press <kbd>Enter</kbd> twice.</li><li>Press <kbd>C</kbd> for the circle tool, click inside the rectangle to place the center, type <code>10</code> for the diameter and press <kbd>Enter</kbd> twice.</li><li>Press <kbd>D</kbd> for the dimension tool. Click the circle&#39;s center and the rectangle&#39;s left edge, then click to place the dimension and enter <code>20</code>. Repeat for the bottom edge.</li><li>Press <kbd>Esc</kbd> to leave the tool, and <kbd>Esc</kbd> again to leave the sketch.</li></ol><p>The rectangle with the circle forms a profile with a hole. Curves turn from yellow to light grey once they are fully defined by constraints and dimensions.</p><h2 id="extrude">2. Extrude</h2><ol><li>Press <kbd>E</kbd> for Extrude and click the shaded profile.</li><li>Drag the arrow in the viewport or type <code>6</code> into <strong>Distance</strong>.</li><li>Press <kbd>Enter</kbd> to confirm.</li></ol><p>The plate appears and a new feature is added to the timeline at the bottom of the window. The sketch is hidden automatically.</p><h2 id="fillet">3. Round the corners</h2><ol><li>Press <kbd>F</kbd> for Fillet and click the four vertical edges of the plate.</li><li>Set the <strong>Radius</strong> to <code>5</code> and press <kbd>Enter</kbd>.</li></ol><h2 id="change">4. Change your mind</h2><p>Double-click the sketch icon in the timeline, double-click the width dimension and change it to <code>100</code>. Leave the sketch and watch the plate, the hole and the fillets update.</p><p>To make the design even more flexible, add a <a href="#docs/parameters">parameter</a> named <code>width</code> and use it in the dimension instead of a fixed number.</p><h2 id="next">5. Next steps</h2><ul><li>Assign a <a href="#docs/materials">material</a> to see the plate&#39;s weight.</li><li>Run a <a href="#docs/simulation/static-load">static load</a> simulation to see how it bends.</li><li>Create a <a href="#docs/drawings">drawing</a> or generate <a href="#docs/cam">toolpaths</a> to make it.</li><li>Save the document with <kbd>Ctrl</kbd>+<kbd>S</kbd>, or export it as STEP, STL or 3MF from the File menu.</li></ul>',15)]))}const h2={},p2=lt(h2,[["render",f2]]);function g2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>User Interface</h1><p class="lead">ProtoSolid&#39;s window is built around a large 3D viewport, with all tools floating above it. Here&#39;s what you find where.</p><h2 id="layout">Window layout</h2><div class="table-wrap"><table><thead><tr><th>Area</th><th>Location</th><th>Purpose</th></tr></thead><tbody><tr><td>Tab bar</td><td>Top</td><td>The app menu, one tab per open document, and the version history button.</td></tr><tr><td>Toolbar</td><td>Top center</td><td>All modeling tools, organized in tabs. See <a href="#docs/user-interface/toolbar">Toolbar</a>.</td></tr><tr><td>Tree</td><td>Left</td><td>The component tree with all solids, sketches, parameters and more. See <a href="#docs/components/tree">The tree</a>.</td></tr><tr><td>Side bar</td><td>Right</td><td>Saved views, zoom buttons and display settings. See <a href="#docs/viewport">Viewport &amp; Display</a>.</td></tr><tr><td>Info box</td><td>Bottom right</td><td>Measurements of the current selection, progress and messages.</td></tr><tr><td>Timeline</td><td>Bottom center</td><td>The parametric history of the document. See <a href="#docs/history">History &amp; Timeline</a>.</td></tr></tbody></table></div><p>Some tools replace parts of this layout while they are open: animations and CAM setups show their own bars in place of the timeline, drawings open a sheet editor, and merging versions shows the merge panel in place of the toolbar.</p><h2 id="documents">Documents &amp; tabs</h2><p>Every open document gets a tab. An asterisk after its name marks unsaved changes. Hover a tab to see the file&#39;s path, and click the × to close it.</p><p>The app menu (<strong>☰</strong>, or the menu bar on macOS) offers <strong>New Document</strong>, <strong>Open...</strong>, <strong>Save</strong>, <strong>Save as...</strong>, <strong>Import...</strong>, <strong>Export...</strong>, the list of recent documents and the <a href="#docs/preferences">settings</a>. You can also drop files onto the window: ProtoSolid documents can be opened or placed into the active component, STEP files are placed directly.</p><h2 id="toolbar">Toolbar</h2><p>Tools are grouped into tabs. Press <kbd>Tab</kbd> to show all tabs at once, stacked on top of each other. Tools with a hot key show it as a small badge.</p><div class="table-wrap"><table><thead><tr><th>Tab</th><th>Tools</th></tr></thead><tbody><tr><td>Construct</td><td>Sketch, Plane, Axis, Point, Centroid, Parameter, Variant, Place</td></tr><tr><td>Solid</td><td>Extrude, Revolve, Loft, Sweep, Pattern, Mirror, Coil, Thread, Web</td></tr><tr><td>Edit Solid</td><td>Move, Offset, Fillet, Chamfer, Shell, Boolean, Draft, Split, Replace, Dissolve, Align</td></tr><tr><td>Sheet Metal</td><td>Rules, Face, Contour, Flange, Hem, Bend, Unfold, Refold, Flatten</td></tr><tr><td>Simulate</td><td>Material, Joint, Group, Motion Link, Animation, Static Load, Heat Flow, Fluid Flow</td></tr><tr><td>Inspect</td><td>Interference, Curvature, Diagnostic Shading, Section View</td></tr><tr><td>Tools</td><td>Manufacture, Drawing, Canvas, Export</td></tr></tbody></table></div><p>Inside a sketch the tabs change to <strong>Sketch</strong>, <strong>Edit Sketch</strong> and <strong>Constrain</strong>. CAM setups add a <strong>Milling</strong> tab, and drawings show <strong>Views</strong>, <strong>Annotate</strong> and <strong>Symbols</strong>.</p><h2 id="feature-box">Working with features</h2><p>Choosing a feature opens its options box below the toolbar. It contains <strong>pickers</strong> for the geometry the feature needs, like profiles, faces or an axis, and fields for its settings.</p><ul><li>Pickers are shown as colored circles. The first one activates automatically, the next ones follow as soon as the previous input is complete. Click a picker to pick again, right-click it to clear it.</li><li>Press <kbd>1</kbd>–<kbd>9</kbd> to activate a picker by its position. Hold <kbd>Ctrl</kbd> to keep picking multiple items.</li><li>Inputs in parentheses, like <strong>(Axis)</strong>, are optional.</li><li>Numeric fields accept <a href="#docs/parameters">expressions</a>. Many values can also be adjusted by dragging gizmos in the viewport.</li><li>Errors are shown in red and must be fixed before confirming. Warnings are shown in yellow.</li><li>Press <kbd>Enter</kbd> or click <strong>Confirm</strong> to apply the feature, <kbd>Esc</kbd> or <strong>Cancel</strong> to discard it.</li></ul><h2 id="selection">Selection</h2><ul><li>Click to select a face, edge, sketch element, construction geometry or joint. <kbd>Ctrl</kbd>+click adds to or removes from the selection.</li><li>When a face and an edge lie under the cursor, the edge wins. Press and hold for half a second to choose from all items under the cursor.</li><li>Double-click a face or edge to select its whole solid. Double-click a sketch curve to edit its sketch.</li><li>After selecting a face or edge, a small widget offers <strong>Select Solid</strong>, <strong>Activate Component</strong>, and a button for every feature that created or modified that geometry, so you can jump straight to editing it.</li></ul><h2 id="info-box">Info box</h2><p>The info box shows the size of the current selection: weight, volume and surface area of solids and components, areas of faces, lengths of edges, and radius, diameter and length of sketch curves. While the model recalculates, it shows progress instead, and it briefly displays messages like export results.</p>',19)]))}const m2={},y2=lt(m2,[["render",g2]]);function b2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Viewport &amp; Display</h1><p class="lead">Navigate around your model, save views you need often, and choose how the model is rendered, from hidden line views to real-time path tracing.</p><h2 id="navigation">Navigating</h2><div class="table-wrap"><table><thead><tr><th>Input</th><th>Action</th></tr></thead><tbody><tr><td><kbd>Alt</kbd> + left drag</td><td>Orbit</td></tr><tr><td><kbd>Shift</kbd> + left drag, or right drag</td><td>Pan</td></tr><tr><td>Mouse wheel, or middle drag</td><td>Zoom</td></tr><tr><td><kbd>Shift</kbd> or <kbd>Alt</kbd> + double-click</td><td>Set the orbit center to the clicked point</td></tr></tbody></table></div><p>Left dragging without a modifier is reserved for selection and for moving parts of an <a href="#docs/assemblies/dragging">assembly</a>.</p><h2 id="views">Views</h2><p>The <strong>View</strong> section of the side bar lists the standard views <strong>Top</strong>, <strong>Front</strong>, <strong>Side</strong> and <strong>Home</strong>. <kbd>Ctrl</kbd>+click Top, Front or Side to look from the opposite direction. When the <strong>Preview on hover</strong> preference is on, hovering a view previews it.</p><p>After moving the camera, click <strong>+</strong> to save the current view to the document. Click an active view to rename it, or use the trash icon to delete it. The <strong>⋮</strong> menu sets what a saved view restores:</p><ul><li><strong>Camera</strong>, <strong>Part Visibility</strong>, <strong>Section Views</strong> and <strong>Display Settings</strong> (on by default).</li><li><strong>Active Comp.</strong>, <strong>History Marker</strong> and <strong>Tree Expansion</strong> (off by default).</li><li>Under <strong>Camera Settings</strong>, <strong>Zoom to fit</strong> and <strong>Rotation only</strong> adjust how the camera moves to the view.</li></ul><p>Saved views with the history marker are a convenient way to jump back and forth between design stages.</p><h3>Zoom</h3><p><strong>Fit All</strong> shows the entire model, <strong>Fit Active</strong> the active component, and <strong>Fit Selection</strong> the selected items. <strong>Nearest Plane</strong> looks straight at the active sketch, or at the main plane closest to the current view direction.</p><h2 id="display">Display settings</h2><div class="table-wrap"><table><thead><tr><th>Setting</th><th>Options</th></tr></thead><tbody><tr><td>Projection <kbd>O</kbd></td><td>Orthographic (default) or Perspective.</td></tr><tr><td>Shading <kbd>W</kbd></td><td>Shaded + Hidden Lines (default), Shaded, Shaded + Wire, Wireframe, or Path traced.</td></tr><tr><td>Material <kbd>M</kbd></td><td>Materials (default) shows the assigned materials, Component Colors shows every component in its own color.</td></tr></tbody></table></div><h3>Path tracing</h3><p><strong>Path traced</strong> shading renders the model with physically based lighting, reflections and transparency, refining the image progressively while the camera rests. It is ideal for checking materials and creating presentation images. Section views cut the actual geometry in this mode.</p><h3>Sketch display</h3><p>While editing a sketch, the side bar adds <strong>Section</strong>, which cuts the model at the sketch plane, and <strong>Constraints</strong>, which shows or hides constraint markers.</p><h2 id="canvas">Reference images</h2><p><strong>Tools › Canvas</strong> places an image in the viewport, for example a photo or scan to trace over. In the tree you can choose the <strong>Image Source</strong>, align it to the <strong>Top</strong>, <strong>Front</strong> or <strong>Side</strong> plane and adjust its <strong>Scale</strong>, <strong>Transparency</strong> and <strong>Position</strong>. Common image formats like PNG, JPEG, SVG and WebP are supported.</p><h2 id="appearance">Appearance</h2><p>Theme, shadows, anti-aliasing and other rendering options are found in the <a href="#docs/preferences">preferences</a>.</p>',22)]))}const v2={},w2=lt(v2,[["render",b2]]);function k2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Components</h1><p class="lead">A document holds a tree of components. Components organize your design into parts and sub-assemblies, each with their own solids, sketches, parameters and settings.</p><h2 id="structure">Structure</h2><p>Every document starts with a root component called <strong>Main Assembly</strong>. Components can be nested to any depth. Each component has its own origin with the X, Y and Z axes and the XY, XZ and YZ planes, and gets its own color.</p><h3>The active component</h3><p>One component is always active. New features are added to it, and other components are drawn faded. Double-click a component in the tree, or use its <strong>Activate</strong> button, to activate it.</p><h2 id="creating">Creating components</h2><ul><li><strong>Create Component</strong> (+ on a tree entry) adds an empty child component and activates it.</li><li><strong>Create Sibling Instance</strong> adds another instance of a component. Instances share their definition, so changes to one apply to all. They are marked <em>&lt;Inst&gt;</em> in the tree.</li><li><strong>Convert to Component</strong> on a solid moves it into a new child component.</li><li><strong>Place</strong> inserts another file as a linked component. See <a href="#docs/components/place">below</a>.</li></ul><p>These actions are recorded in the timeline like any other feature.</p><h2 id="tree">The tree</h2><p>The tree on the left shows the component hierarchy. Expand a component to see its contents, in this order:</p><ul><li>Parameters and variant</li><li>Export configurations, drawings and flat patterns</li><li>Material</li><li>Simulations, CAM setups and animations</li><li>Centroid and construction geometry</li><li>Canvases and section views</li><li>Solids and sketches</li><li>Child components</li></ul><p>Use the eye icons to show and hide items, and click the name of a selected item to rename it. <kbd>Ctrl</kbd>+click selects multiple items. Deleting a solid from the tree adds a <strong>Remove</strong> feature to the timeline.</p><h2 id="place">Placing files</h2><p><strong>Construct › Place</strong> inserts another ProtoSolid document (<code>.cad</code>) or a STEP file (<code>.step</code>, <code>.stp</code>) into the active component. Position it with the gizmo and confirm.</p><ul><li>Placed components are read-only and marked with a link icon.</li><li>STEP assemblies keep their product structure and colors. Turn on <strong>Flatten</strong> to merge everything into a single component.</li><li>For ProtoSolid documents with a <a href="#docs/parameters/variants">variant</a>, choose the <strong>Variant</strong> to use. Joints of the placed document are brought along.</li></ul><p>The placed file&#39;s contents are stored in your document, so it keeps working without the original file. When the original changes, the feature shows an exclamation mark, and you can apply the new revision with <strong>Update to the latest revision of the referenced file</strong>. Updates are never applied without asking.</p>',17)]))}const _2={},L2=lt(_2,[["render",k2]]);function x2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>History &amp; Timeline</h1><p class="lead">Every change to your parts and assemblies is recorded as a feature in the timeline at the bottom of the window. Go back in history to edit, reorder or delete earlier operations, or insert new ones, and the entire model is recomputed accordingly.</p><h2 id="timeline">The timeline</h2><p>The timeline shows one icon per feature, in the order they are applied. A colored line below each icon shows the color of the component it belongs to. Hovering an icon highlights the geometry it created, and hovering geometry in the viewport highlights the features that made it.</p><p>Features that fail are drawn in red, features with warnings in orange. Hover them to read the message. A failed feature leaves the model as it was before it, so later features can still be computed.</p><h2 id="editing">Editing features</h2><p>Double-click a feature icon to edit it. The model is rolled back to that point in history, so you see the geometry exactly as it was when the feature was created. Its options box opens above the timeline. Confirm your changes and all later features are recomputed.</p><p>Select an icon to show its actions: <strong>Move marker here</strong>, <strong>Edit</strong> and <strong>Delete</strong>. <kbd>Ctrl</kbd>+click selects several icons.</p><p>You can also jump to a feature from the model: select a face or edge and use the buttons that appear next to the cursor to edit the feature or sketch that created it.</p><h2 id="reordering">Reordering</h2><p>Drag a feature icon onto another one to move it before or after that feature. ProtoSolid keeps track of the geometry each feature refers to, so references survive reordering wherever the geometry still exists.</p><h2 id="marker">The history marker</h2><p>The round marker in the timeline separates applied features from later ones, which are drawn faded. The model is only computed up to the marker, and new features are inserted at its position. This lets you add operations in the middle of the history.</p><ul><li>Drag the marker to any position in the timeline.</li><li>Use the arrow buttons to step it back and forth or move it to the start or end.</li><li>Use <strong>Move marker here</strong> on a selected feature.</li></ul><p>Saved <a href="#docs/viewport/views">views</a> can store the marker position, so you can switch between stages of your design with one click.</p><h2 id="filtering">Filtering</h2><p>By default the timeline shows all features and dims those that don&#39;t belong to the active component and its children. The <strong>Timeline features</strong> preference can hide unrelated features instead.</p><h2 id="undo">Undo &amp; redo</h2><p><kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes the last change to the document, <kbd>Ctrl</kbd>+<kbd>Y</kbd> or <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> redoes it. Inside a sketch, undo and redo apply to the sketch&#39;s own editing history. Undo is not available while a feature is being edited. For long-term history, see <a href="#docs/versions">Versions &amp; Branches</a>.</p>',19)]))}const S2={},A2=lt(S2,[["render",x2]]);function C2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Sketching</h1><p class="lead">Most parts start as a sketch: a set of 2D curves drawn on a plane or face, which then serves as input for solid features like Extrude or Revolve. Sketches are fully parametric, so dimensions and constraints keep them in shape when you change your design.</p><h2 id="creating">Creating a sketch</h2><p>Choose <strong>Sketch</strong> <kbd>S</kbd> from the <strong>Construct</strong> tab and pick a construction plane or a face of your model. The camera turns to look at the sketch plane and the toolbar switches to the sketch tabs: <strong>Sketch</strong>, <strong>Edit Sketch</strong> and <strong>Constrain</strong>.</p><p>Every component offers the standard XY, XZ and YZ planes. You can also sketch on <a href="#docs/construction/planes">construction planes</a> or on any face of a solid. When several items lie under the cursor, press and hold to choose from a list.</p><h3>Sketching on curved surfaces</h3><p>Sketches can also be placed on non-planar faces, like the side of a cylinder. The face is unwrapped into a flat drawing area, shown with a grey outline, and your curves are wrapped back onto the surface when you leave the sketch. Surface sketches can be used with <strong>Extrude</strong> (by distance). Curve projection and the section display require planar sketches.</p><h3>Editing and leaving sketches</h3><p>To edit an existing sketch, double-click it in the tree, in the timeline, or double-click one of its curves in the viewport. To leave the sketch, click <strong>Confirm</strong>, press <kbd>Enter</kbd>, or press <kbd>Esc</kbd> while no drawing tool is active. The first <kbd>Esc</kbd> only ends the current tool.</p><p>Inside a sketch, undo and redo work on a separate sketch history. Whether the camera moves when entering and leaving sketches can be configured with the <strong>Sketch camera</strong> preference.</p><h2 id="drawing-tools">Drawing tools</h2><p>All drawing tools snap to existing points, curves and alignment guides, and automatically add matching constraints. See <a href="#docs/constraints/snapping">Snapping &amp; inference</a>.</p><div class="table-wrap"><table><thead><tr><th>Tool</th><th>How to use</th></tr></thead><tbody><tr><td>Point</td><td>Click to place a point.</td></tr><tr><td>Line <kbd>L</kbd></td><td>Click successive points to draw a chain of lines. The chain ends when you click on existing geometry, or use the floating widget to start a new chain or exit.</td></tr><tr><td>Rectangle <kbd>R</kbd></td><td>Two clicks. Choose the <strong>Mode</strong>: <strong>Two corners</strong> or <strong>Center and corner</strong>. Sides are constrained perpendicular and the bottom edge horizontal.</td></tr><tr><td>Arc <kbd>A</kbd></td><td>Click the start point, the end point and then a point the arc passes through.</td></tr><tr><td>Circle <kbd>C</kbd></td><td>Click the center, then click to set the size.</td></tr><tr><td>Spline <kbd>B</kbd></td><td>Each click adds a control point. Switch the <strong>Mode</strong> to <strong>Insert point</strong> or <strong>Remove point</strong> to edit existing splines.</td></tr><tr><td>Slot</td><td>Click both arc centers, then a point that sets the width.</td></tr><tr><td>Polygon</td><td>Set the number of <strong>Sides</strong> (3–64), click the center, then a corner.</td></tr><tr><td>Text</td><td>Click the start of the baseline and type. See <a href="#docs/sketching/text">Text</a>.</td></tr></tbody></table></div><h3>Entering exact values</h3><p>While drawing, input fields for length, angle, diameter, width, height or radius follow the cursor. Type a value and press <kbd>Enter</kbd> to lock it, then press <kbd>Enter</kbd> again to place the point. <kbd>Tab</kbd> moves between fields. Values can be <a href="#docs/parameters">expressions</a> with units and parameters, and every locked value becomes a real dimension on the finished geometry.</p><h3>Construction geometry</h3><p>Select curves and press <kbd>X</kbd> (or the <strong>Reference geometry</strong> button) to turn them into construction geometry. Construction curves are drawn dashed, can be constrained like any other curve, but don&#39;t form profiles. The center-and-corner rectangle and the slot create construction lines automatically.</p><h2 id="edit-tools">Edit tools</h2><div class="table-wrap"><table><thead><tr><th>Tool</th><th>How to use</th></tr></thead><tbody><tr><td>Trim <kbd>T</kbd></td><td>Hover a curve to preview the piece between its neighboring intersections, click to remove it. Constraints on the remaining ends are kept.</td></tr><tr><td>Break</td><td>Click a curve to split it at the nearest intersection.</td></tr><tr><td>Extend</td><td>Click near the end of a line or arc to extend it to the next curve.</td></tr><tr><td>Fillet <kbd>F</kbd></td><td>Enter a <strong>Radius</strong>, then click a corner shared by two curves, or click two curves. All fillets created in one go share a single radius dimension.</td></tr><tr><td>Offset</td><td>Click a curve or a closed profile, move the mouse and click to place a parallel copy. Connected chains are offset as a whole and stay linked to their source.</td></tr><tr><td>Mirror</td><td>Click the mirror line first, then click the elements to mirror. Elements selected before starting the tool are mirrored right away. Copies stay linked by symmetric constraints.</td></tr><tr><td>Project <kbd>P</kbd></td><td>Bring existing edges, vertices and curves of other sketches into this sketch. See <a href="#docs/constraints/projection">Using existing geometry</a>.</td></tr><tr><td>Intersect <kbd>I</kbd></td><td>Create the curves where faces, edges or other sketches cross the sketch plane.</td></tr></tbody></table></div><h2 id="text">Text</h2><p>The <strong>Text</strong> tool creates text from the fonts installed on your computer. Click to set the start of the baseline, type your text and adjust the <strong>Text size</strong>, <strong>Font</strong> and <strong>Font style</strong>. Press <kbd>Enter</kbd> or click away to finish, or <kbd>Esc</kbd> to cancel.</p><p>Text outlines form profiles like any other closed curves, so you can extrude or cut lettering directly. Double-click a text to edit it again, or use <strong>Convert to sketch curves</strong> to turn it into regular curves that can be edited individually.</p><h2 id="selecting-dragging">Selecting &amp; dragging</h2><ul><li>Click to select, <kbd>Ctrl</kbd>+click to add to the selection.</li><li>Drag on empty space to box-select fully enclosed elements.</li><li>Drag endpoints, centers and spline control points to reshape the sketch. The solver keeps all constraints satisfied while you drag.</li><li>Drag a line or spline to move it, drag a circle or arc to change its radius. With several elements selected, they move together.</li><li><kbd>Delete</kbd> or <kbd>Backspace</kbd> removes the selected elements, constraints and dimensions.</li><li><kbd>Ctrl</kbd>+<kbd>C</kbd> copies the selected elements with the constraints between them. <kbd>Ctrl</kbd>+<kbd>V</kbd> pastes them at the cursor; click to place.</li></ul><h2 id="profiles">Profiles</h2><p>Closed regions formed by the sketch&#39;s curves are detected automatically and shaded. Overlapping curves are split at their intersections, loops inside other loops become holes, and construction geometry is ignored. Solid features like <a href="#docs/solid-features/extrude">Extrude</a> pick these profiles as input.</p><p>When a sketch is used by a feature, it is hidden automatically. Show it again with the eye icon in the tree.</p><h2 id="display">Display options</h2><ul><li><strong>Constraints</strong> shows or hides constraint markers.</li><li><strong>Section</strong> cuts the model at the sketch plane, so you can see the geometry you&#39;re sketching against.</li><li><strong>Curvature comb</strong> shows the curvature of the selected splines.</li></ul>',29)]))}const T2={},P2=lt(T2,[["render",C2]]);function M2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Constraints &amp; Dimensions</h1><p class="lead">Constraints define geometric relationships between sketch elements, dimensions define their sizes. Together they turn a loose drawing into a precise, parametric profile that adapts when you change a value.</p><h2 id="constraints">Constraints</h2><p>Choose a tool from the <strong>Constrain</strong> tab and click the elements in order. The tool stays active, so you can add several constraints in a row. Click empty space to start over.</p><div class="table-wrap"><table><thead><tr><th>Constraint</th><th>Elements</th><th>Effect</th></tr></thead><tbody><tr><td>Touch</td><td>Point + curve</td><td>The point lies on the line, circle or arc.</td></tr><tr><td>Parallel</td><td>Two lines</td><td>The lines are parallel.</td></tr><tr><td>Perpendicular</td><td>Two lines, or a line and a circle/arc</td><td>The lines are at a right angle. With a circle, the line passes through its center.</td></tr><tr><td>Hor/Vert</td><td>A line, or two points</td><td>Horizontal or vertical, chosen automatically from the current orientation.</td></tr><tr><td>Tangent</td><td>Lines, circles, arcs and splines</td><td>The curves meet tangentially. Splines are tangent at their ends.</td></tr><tr><td>Equal</td><td>Two lines, or two circles/arcs</td><td>Equal length or equal radius.</td></tr><tr><td>Concentric</td><td>Two circles/arcs</td><td>The centers coincide.</td></tr><tr><td>Symmetric</td><td>Mirror line, then pairs of points or curves</td><td>The pair is mirrored across the line. The mirror line stays selected for further pairs.</td></tr><tr><td>Fix</td><td>A point or curve</td><td>Locks the element in place.</td></tr></tbody></table></div><p>Coincident, midpoint and intersection constraints have no tool of their own. They are created automatically when you snap to points, midpoints and intersections.</p><h3>Constraint markers</h3><p>Constraints are shown as small icons next to the geometry. Hover an icon to highlight the constrained elements, click it to select the constraint and press <kbd>Delete</kbd> to remove it. Use the <strong>Constraints</strong> display switch to hide the icons.</p><h2 id="snapping">Snapping &amp; inference</h2><p>While drawing or dragging, the cursor snaps to nearby points, in this order of priority: endpoints, centers and the sketch origin, then intersections, line midpoints, points on curves, and finally alignment guides. An animated ring marks the active snap point.</p><p>Dashed guides appear when the cursor aligns horizontally or vertically with recently used points, or when a new line runs parallel, perpendicular or tangent to existing geometry. Snapping to a crossing of two guides is possible as well.</p><p>Every snap adds the matching constraint:</p><ul><li>Snapping to a point adds a <strong>coincident</strong> constraint, to a midpoint a <strong>midpoint</strong> constraint.</li><li>Snapping to a curve adds a <strong>touch</strong> constraint, to an intersection of two curves an <strong>intersection</strong> point.</li><li>Lines drawn horizontally or vertically get a <strong>Hor/Vert</strong> constraint.</li><li>Following a parallel or perpendicular guide adds <strong>Parallel</strong> or <strong>Perpendicular</strong>.</li><li>Lines that start or end almost tangent to a circle or arc get a <strong>Tangent</strong> constraint.</li><li>Releasing a dragged point on a snap target adds the matching constraint too, as long as the sketch can still be solved.</li></ul><h2 id="dimensions">Dimensions</h2><p>Choose <strong>Dimension</strong> <kbd>D</kbd>, click one or two elements and then click empty space to place the label. The value input opens right away.</p><div class="table-wrap"><table><thead><tr><th>Pick</th><th>Dimension</th></tr></thead><tbody><tr><td>Line</td><td>Length. Placing the label above/below or to the side creates a horizontal or vertical dimension, otherwise an aligned one.</td></tr><tr><td>Circle</td><td>Diameter (⌀)</td></tr><tr><td>Arc</td><td>Radius (R)</td></tr><tr><td>Two points</td><td>Distance, horizontal, vertical or aligned depending on placement</td></tr><tr><td>Point + line</td><td>Perpendicular distance</td></tr><tr><td>Point + circle</td><td>Distance from the center</td></tr><tr><td>Two lines</td><td>Angle, or distance if they are parallel</td></tr><tr><td>Two circles/arcs</td><td>Radial offset. The circles are made concentric.</td></tr></tbody></table></div><h3>Editing dimensions</h3><ul><li>Double-click a dimension&#39;s label to change its value. Press <kbd>Enter</kbd> to apply.</li><li>Use <kbd>↑</kbd> / <kbd>↓</kbd> to step the value, with <kbd>Shift</kbd> for larger and <kbd>Alt</kbd> for smaller steps.</li><li>Drag a label to move it.</li><li>Values can be <a href="#docs/parameters">expressions</a> using units and parameters, like <code>width / 2 + 3mm</code>. Dimensions driven by parameters are shown in purple.</li></ul><h2 id="solver">Solver feedback</h2><p>ProtoSolid&#39;s constraint solver colors every element by how well it is defined. Under-constrained curves are drawn in yellow, fully constrained curves in a light grey. Aim for a fully constrained sketch, so it can&#39;t change shape unexpectedly when the model is edited.</p><p>If a new constraint conflicts with existing ones, a message reports that the sketch was over-constrained and the geometry stays as it was. Use <strong>Undo</strong> to remove the conflicting constraint.</p><div class="table-wrap"><table><thead><tr><th>Color</th><th>Meaning</th></tr></thead><tbody><tr><td>Yellow</td><td>Under-constrained, can still move</td></tr><tr><td>Light grey</td><td>Fully constrained</td></tr><tr><td>Dashed green</td><td>Construction geometry</td></tr><tr><td>Green</td><td>Projected geometry</td></tr><tr><td>Red</td><td>Broken projection, its source was removed</td></tr></tbody></table></div><h2 id="projection">Using existing geometry</h2><p><strong>Project</strong> <kbd>P</kbd> brings model edges, vertices, construction points and curves of other sketches into the active sketch. Projected geometry stays linked to its source, updates when the source changes, and can be used for constraints and dimensions. It is fixed and can&#39;t be dragged.</p><p><strong>Intersect</strong> <kbd>I</kbd> creates the curves where faces cross the sketch plane, and points where edges or curves of other sketches pass through it.</p><p>If the source of a projection disappears, the projected geometry turns red but keeps its last shape and constraints, so the sketch keeps working until you fix the reference. Press <kbd>X</kbd> to turn projected geometry into construction geometry, if it should not take part in profiles.</p>',26)]))}const E2={},$2=lt(E2,[["render",M2]]);function O2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Solid Features</h1><p class="lead">The <strong>Solid</strong> tab contains the features that create geometry, mostly from sketch profiles: Extrude, Revolve, Loft, Sweep, Coil and Web, plus Pattern, Mirror and Thread.</p><h2 id="operations">Operations</h2><p>Most features that create volume have an <strong>Operation</strong> setting, which decides how the new shape combines with the existing bodies of the active component:</p><div class="table-wrap"><table><thead><tr><th>Operation</th><th>Result</th></tr></thead><tbody><tr><td>Join</td><td>Adds the new shape to the existing bodies (default).</td></tr><tr><td>Cut</td><td>Removes the new shape from the existing bodies.</td></tr><tr><td>Intersect</td><td>Keeps only the volume shared by the new shape and the existing bodies.</td></tr><tr><td>Create</td><td>Creates a new, separate body.</td></tr></tbody></table></div><p>Features only affect bodies that are visible when they are created. Hide a body to protect it from a cut. When a feature uses a sketch, the sketch is hidden automatically.</p><h2 id="extrude">Extrude <kbd>E</kbd></h2><p>Extends profiles perpendicular to their sketch plane.</p><ul><li><strong>Profiles</strong>: one or more closed regions of sketches.</li><li><strong>Extent</strong>: <strong>Distance</strong> extrudes by a fixed amount, <strong>Up to face</strong> extrudes until it reaches a selected face, <strong>Through all</strong> cuts through the entire model.</li><li><strong>Side</strong>: <strong>Forward</strong>, <strong>Reverse</strong> or <strong>Both directions</strong> (the distance is applied to each side).</li><li><strong>Start offset</strong> moves the start of the extrusion away from the sketch plane. <strong>End offset</strong> adjusts the end when extruding up to a face.</li></ul><p>Dragging the arrow through the existing body switches between Join and Cut. Extrude is also the feature to use with sketches on <a href="#docs/sketching/creating">curved surfaces</a>, for example to emboss text on a cylinder.</p><h2 id="revolve">Revolve <kbd>V</kbd></h2><p>Rotates profiles around an axis.</p><ul><li><strong>Profiles</strong> and <strong>Axis</strong>: the axis can be a construction axis, a straight edge, a sketch line or the axis of a cylindrical face.</li><li><strong>Extent</strong>: <strong>Angle</strong> (with <strong>Offset</strong> for the start angle), <strong>Up to face</strong>, or <strong>Between faces</strong>.</li><li><strong>Side</strong> flips the direction of rotation.</li></ul><h2 id="loft">Loft</h2><p>Creates a smooth shape that blends between two or more profiles.</p><ul><li><strong>Profiles</strong>: pick at least two profiles in order.</li><li><strong>Untwist</strong> aligns the profiles to avoid twisting (on by default).</li><li><strong>(Guides)</strong>: optional curves or edges that guide the loft between the profiles.</li></ul><h2 id="sweep">Sweep</h2><p>Moves a profile along a path.</p><ul><li><strong>Profile</strong> and <strong>Rail</strong>: the rail can consist of several connected sketch curves or edges.</li><li><strong>Propagation</strong>: <strong>Follow tangent edges</strong> extends the rail along tangent edges automatically, <strong>Selected edges only</strong> uses exactly the picked curves.</li></ul><h2 id="coil">Coil</h2><p>Sweeps profiles along a helix, for springs, screw threads and spirals.</p><ul><li><strong>Profiles</strong> and <strong>Axis</strong>.</li><li><strong>Size</strong>: define the helix by <strong>Revolutions and pitch</strong>, <strong>Revolutions and height</strong>, or <strong>Height and pitch</strong>.</li><li><strong>Handedness</strong>: <strong>Right-handed</strong> or <strong>Left-handed</strong>. <strong>Side</strong> flips the direction along the axis.</li></ul><h2 id="web">Web</h2><p>Creates ribs from open sketch curves, to stiffen a part.</p><ul><li><strong>Curves</strong>: open curves of one planar sketch. Connected curves are chained.</li><li><strong>Thickness</strong> and <strong>Thickness side</strong> (<strong>Symmetric</strong>, <strong>One side</strong> or <strong>Other side</strong>).</li><li><strong>Side</strong> and <strong>Depth</strong>: in which direction and how far the web extends from the sketch plane.</li><li><strong>Extend to body</strong> lengthens the curves until they meet the walls of the existing body.</li></ul><p>Webs always join with the existing body.</p><h2 id="thread">Thread</h2><p>Cuts a real, modeled ISO metric thread into cylindrical faces. Shafts get an external thread, bores an internal one.</p><ul><li><strong>Faces</strong>: one or more cylindrical faces.</li><li><strong>Pitch</strong>: <strong>ISO metric coarse</strong> or <strong>ISO metric fine</strong> choose the standard pitch for the nearest nominal size (M1 to M64), <strong>Custom pitch</strong> lets you enter one.</li><li><strong>Extent</strong>: <strong>Full length</strong> or <strong>Custom length</strong> with <strong>Length</strong>, <strong>Offset</strong> and the end to measure from.</li><li><strong>Handedness</strong>: <strong>Right-handed</strong> or <strong>Left-handed</strong>.</li></ul><div class="note">Model the cylinder at the thread&#39;s nominal diameter: a shaft keeps its diameter as the major diameter, a bore as the minor diameter.</div><h2 id="pattern">Pattern</h2><p>Repeats bodies, components or features.</p><ul><li><strong>Features</strong>: pick bodies in the viewport, components in the tree, or features in the timeline. One pattern takes only one kind of input. Patterned features are replayed at each position, so a patterned hole cuts every time.</li><li><strong>Type</strong>: <strong>Grid</strong> or <strong>Radial</strong>.</li><li>Grid: <strong>U Count</strong>, <strong>V Count</strong>, <strong>U Step</strong> and <strong>V Step</strong> along the component&#39;s X and Y axes.</li><li>Radial: <strong>Axis</strong> and <strong>Count</strong>. With <strong>Spacing</strong> set to <strong>Total angle</strong>, instances are spread across <strong>Total Angle</strong> (evenly around a full circle). With <strong>Angle step</strong> they are placed <strong>Angle Step</strong> apart.</li></ul><p>Counts include the original.</p><h2 id="mirror">Mirror</h2><p>Mirrors bodies or features across a <strong>Plane</strong>, which can be a construction plane or a planar face. Like with patterns, mirrored features are replayed on the other side.</p>',36)]))}const R2={},I2=lt(R2,[["render",O2]]);function F2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Editing Solids</h1><p class="lead">The <strong>Edit Solid</strong> tab refines existing bodies: round and bevel edges, hollow out parts, add draft, combine bodies, and directly move or replace faces.</p><h2 id="fillet">Fillet <kbd>F</kbd></h2><p>Rounds edges.</p><ul><li><strong>Edges</strong>: one or more edges.</li><li><strong>Mode</strong>: <strong>Constant radius</strong> or <strong>Constant width</strong> (the width of the rounded band).</li><li><strong>Continuity</strong>: <strong>G1</strong> fillets are tangent to their neighboring faces. <strong>G2</strong> fillets also match their curvature, for smoother transitions and reflections.</li><li><strong>Propagation</strong>: <strong>Follow tangent edges</strong> includes edges that continue tangentially, <strong>Selected edges only</strong> uses exactly the picked edges.</li></ul><h2 id="chamfer">Chamfer <kbd>H</kbd></h2><p>Bevels edges.</p><ul><li><strong>Mode</strong>: <strong>Equal distances</strong>, <strong>Two distances</strong> (<strong>Distance</strong> and <strong>Distance 2</strong>), or <strong>Distance + angle</strong>.</li><li><strong>Flip sides</strong> swaps the two distances, or which side the angle is measured from.</li><li><strong>Propagation</strong> works as for fillets.</li></ul><h2 id="shell">Shell</h2><p>Hollows out a body, leaving walls of a given thickness.</p><ul><li><strong>(Openings)</strong>: faces to remove, to create an open shell. Without openings, the body becomes a closed, hollow shell.</li><li><strong>Thickness</strong> and <strong>Side</strong>: wall thickness, and whether material is added inside or outside the original surface.</li><li><strong>Corners</strong>: <strong>Rounded</strong> or <strong>Sharp</strong> outer corners.</li></ul><h2 id="draft">Draft</h2><p>Tilts faces by an angle, as needed for molded or cast parts. Pick a <strong>Reference</strong> plane that defines the pull direction, the <strong>Faces</strong> to tilt and the <strong>Angle</strong>. Use <a href="#docs/inspect/diagnostic-shading">Diagnostic Shading</a> to check draft angles.</p><h2 id="boolean">Boolean</h2><p>Combines bodies. Pick the <strong>Tools</strong>, which can also come from other components, and choose the <strong>Operation</strong> to apply them to the remaining bodies of the active component. Turn on <strong>Keep</strong> to keep the tool bodies.</p><h2 id="split">Split</h2><p>Splits the bodies of the active component with a <strong>Tool</strong> plane. <strong>Keep</strong> decides whether <strong>Both</strong> halves or only the <strong>Left</strong> or <strong>Right</strong> one remains.</p><h2 id="move">Move</h2><p>Moves and rotates faces directly, for example to change the length of a part without editing its sketch. Pick the <strong>Faces</strong> and drag the gizmo, or enter <strong>Translate</strong> and <strong>Rotate</strong> values for X, Y and Z. <strong>Gizmo Space</strong> aligns the gizmo with the <strong>World</strong> or <strong>Component</strong> axes. Neighboring faces adapt to the new position.</p><h2 id="offset">Offset</h2><p>Moves faces along their normal by a <strong>Distance</strong>, making a part thicker or thinner. <strong>Side</strong> flips the direction.</p><h2 id="replace">Replace</h2><p>Replaces the geometry of one face (<strong>Replace</strong>) with that of another (<strong>With</strong>).</p><h2 id="dissolve">Dissolve</h2><p>Removes the selected faces and heals the body by extending the surrounding faces, for example to remove a fillet or a small feature from an imported part.</p><h2 id="align">Align</h2><p>Moves whole bodies so that their geometry lines up.</p><ul><li><strong>Bodies</strong>: the bodies to move.</li><li><strong>Type</strong>: align a <strong>Plane</strong>, <strong>Axis</strong> or <strong>Point</strong> (<strong>From</strong>) to another one (<strong>To</strong>).</li><li><strong>Flip</strong>, <strong>Offset</strong> and <strong>Angle</strong> fine-tune the alignment of planes and axes.</li></ul><h2 id="remove">Removing bodies</h2><p>Delete a solid with the trash icon in the tree. This adds a <strong>Remove</strong> feature to the timeline, so the body can be restored by deleting that feature.</p>',30)]))}const D2={},N2=lt(D2,[["render",F2]]);function H2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Construction Geometry</h1><p class="lead">Construction planes, axes and points serve as references for sketches and features where the model itself offers no suitable geometry. They are parametric and update with the geometry they are based on.</p><p>Every component has an origin with the X, Y and Z axes and the XY, XZ and YZ planes. Y points up, so the XZ plane is the ground plane. Additional construction geometry is created from the <strong>Construct</strong> tab and listed in the tree as <strong>Plane 1</strong>, <strong>Axis 1</strong>, <strong>Point 1</strong> and so on, where it can be renamed and hidden.</p><h2 id="planes">Planes</h2><div class="table-wrap"><table><thead><tr><th>Mode</th><th>Inputs</th></tr></thead><tbody><tr><td>Offset &amp; angle</td><td>A base plane or planar face, an <strong>Offset</strong> and <strong>Rotation X</strong> / <strong>Rotation Y</strong>. Drag the gizmos to adjust.</td></tr><tr><td>Parallel through point</td><td>A base plane and a point.</td></tr><tr><td>Midplane</td><td>Two planes. The new plane lies halfway between them.</td></tr><tr><td>Three points</td><td>Three points that are not on a line.</td></tr><tr><td>Through axis at angle</td><td>An axis, a base plane and an <strong>Angle</strong>.</td></tr><tr><td>Through axis and point</td><td>An axis and a point.</td></tr><tr><td>Normal to curve</td><td>A curve or edge, and a <strong>Position %</strong> along it.</td></tr></tbody></table></div><p>All modes offer an additional <strong>Offset</strong>.</p><h2 id="axes">Axes</h2><div class="table-wrap"><table><thead><tr><th>Mode</th><th>Inputs</th></tr></thead><tbody><tr><td>Perpendicular to face</td><td>A face, and an optional point to pass through. Without the point, the axis goes through the face&#39;s center.</td></tr><tr><td>Through two planes</td><td>Two planes. The axis lies on their intersection.</td></tr><tr><td>Through two points</td><td>Two points.</td></tr></tbody></table></div><h2 id="points">Points</h2><div class="table-wrap"><table><thead><tr><th>Mode</th><th>Inputs</th></tr></thead><tbody><tr><td>Through two axes</td><td>Two axes. If they don&#39;t intersect, the point lies halfway between them.</td></tr><tr><td>Through three planes</td><td>Three planes meeting in a single point.</td></tr><tr><td>At edge and plane</td><td>A curve or edge, and a plane it crosses.</td></tr><tr><td>Along path</td><td>A curve or edge, and a <strong>Position %</strong> along it.</td></tr></tbody></table></div><h2 id="references">Using references</h2><p>Wherever a feature asks for a plane, axis or point, you can pick model geometry as well:</p><ul><li><strong>Planes</strong>: construction planes and planar faces.</li><li><strong>Axes</strong>: construction axes, straight edges, cylindrical faces, sketch lines and sketch circles.</li><li><strong>Points</strong>: construction points, vertices, sketch points, centers of spherical faces and the centroid.</li></ul><h2 id="centroid">Centroid</h2><p><strong>Centroid</strong> adds a point at the active component&#39;s center of mass, which can be used as a reference like any other point. See <a href="#docs/assemblies/mass-properties">Mass properties</a>.</p>',15)]))}const j2={},B2=lt(j2,[["render",H2]]);function U2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Sheet Metal</h1><p class="lead">Design parts that are cut from flat sheet and bent into shape. Build them from faces, flanges and hems, unfold them to add cuts across bends, and export flat patterns for laser cutting.</p><h2 id="rules">Rules</h2><p>Start with <strong>Rules</strong>. It adds the parameters <code>thickness</code> and <code>bendRadius</code> to the active component. New sheet metal features use these parameters automatically, so you can change the sheet&#39;s thickness and bend radius for the whole part in one place.</p><p>All sheet metal features join with the existing body.</p><h2 id="face">Face</h2><p>Creates a flat sheet from sketch <strong>Profiles</strong> with the given <strong>Thickness</strong>. <strong>Side</strong> flips the direction. This is usually the base of a sheet metal part.</p><h2 id="contour">Contour</h2><p>Creates a bent sheet from an open chain of straight sketch lines, like a U-channel or Z-profile drawn in cross section. Corners become bends with the <strong>Bend radius</strong>.</p><ul><li><strong>Contour</strong>: a single chain of lines in one sketch.</li><li><strong>Thickness</strong> and <strong>Thickness side</strong>.</li><li><strong>Width direction</strong> (<strong>Forward</strong>, <strong>Reverse</strong> or <strong>Both directions</strong>) and <strong>Width</strong>: how far the profile extends from the sketch plane.</li></ul><h2 id="flange">Flange</h2><p>Bends a new wall up from straight edges of the sheet.</p><ul><li><strong>Edges</strong>: one or more straight sheet edges.</li><li><strong>Position</strong>: <strong>Material inside</strong> keeps the outer face of the flange on the edge, <strong>Material outside</strong> puts the inner face on it, and <strong>Bend outside</strong> starts the bend at the edge.</li><li><strong>Length</strong> (measured to the outer virtual sharp), <strong>Angle</strong> and <strong>Direction</strong>.</li><li><strong>Bend radius</strong>.</li><li><strong>Corners</strong>: <strong>Mitered</strong> or <strong>Open</strong> where neighboring flanges meet, with a <strong>Corner gap</strong>.</li></ul><p>Bend reliefs are added automatically where needed.</p><h2 id="hem">Hem</h2><p>Folds an edge back onto itself by 180°, for safe edges or added stiffness. Set the <strong>Length</strong>, the <strong>Gap</strong> between the layers, the <strong>Position</strong> and the <strong>Direction</strong>. Hems meeting at a corner are mitered.</p><h2 id="bend">Bend</h2><p>Bends a flat sheet along a sketched line.</p><ul><li><strong>Sheet face</strong> and <strong>Bend line</strong>: a straight line sketched on that face.</li><li><strong>Line position</strong>: the bend is <strong>centered on</strong>, <strong>starts at</strong> or <strong>ends at</strong> the line.</li><li><strong>Moving side</strong> decides which side of the sheet moves.</li><li><strong>Angle</strong>, <strong>Direction</strong>, <strong>Bend radius</strong> and <strong>K-factor</strong>.</li></ul><h2 id="unfold-refold">Unfold &amp; Refold</h2><p><strong>Unfold</strong> flattens a sheet metal body in the timeline, keeping the selected <strong>Fixed face</strong> in place. Add features to the flat sheet, like holes or cutouts across bends, and then use <strong>Refold</strong> to fold it back. Your changes are carried along.</p><h2 id="flat-pattern">Flat patterns</h2><p><strong>Flatten</strong> adds a flat pattern to the component&#39;s tree. While it is expanded, the viewport shows the part unfolded. Configure the export:</p><ul><li><strong>Format</strong>: <strong>DXF</strong> or <strong>STEP</strong>.</li><li><strong>K-Factor</strong>: position of the neutral axis within the sheet, used to compute bend allowances (0.44 by default).</li><li><strong>Units</strong>: <strong>Millimeters</strong> or <strong>Inches</strong>.</li><li><strong>Bend Lines</strong>: mark bend centerlines on their own layer in DXF files.</li><li><strong>Destination Path</strong> and <strong>Export on Save</strong>.</li></ul><p>DXF files contain the outline on the <code>OUTLINE</code> layer and bend lines on the <code>BEND</code> layer, ready for laser and waterjet cutting.</p>',25)]))}const z2={},W2=lt(z2,[["render",U2]]);function V2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt(`<h1>Parameters &amp; Variants</h1><p class="lead">Named parameters let you drive your design from a few key values. Variants store different sets of these values, so a single document can describe a whole family of parts.</p><h2 id="parameters">Parameters</h2><p>Choose <strong>Construct › Parameter</strong> to add a parameter to the active component. It appears at the top of the component&#39;s tree entry as <code>name = value</code>. Click its name or value to edit it.</p><ul><li>Parameters are inherited by child components. A child can override a parameter by defining one with the same name.</li><li>Renaming a parameter updates every place that uses it.</li><li>Deleting a parameter replaces its uses with its current value.</li></ul><p>Fields and dimensions that use parameters are highlighted, so you can tell driven values apart from fixed ones at a glance.</p><h2 id="expressions">Expressions</h2><p>Every length and angle input, every sketch dimension and every parameter value accepts an expression.</p><div class="table-wrap"><table><thead><tr><th>Element</th><th>Syntax</th></tr></thead><tbody><tr><td>Numbers</td><td><code>12</code>, <code>0.5</code>, <code>.5</code>, <code>0,5</code></td></tr><tr><td>Operators</td><td><code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> and parentheses</td></tr><tr><td>Length units</td><td><code>mm</code>, <code>cm</code>, <code>m</code>, <code>inch</code></td></tr><tr><td>Angle units</td><td><code>°</code>, <code>deg</code>, <code>rad</code></td></tr><tr><td>Parameters</td><td>Any parameter name of the component or its parents</td></tr><tr><td>Measures</td><td>Live measurements of picked geometry</td></tr></tbody></table></div><p>Examples:</p><pre><code>width / 2
3mm + 0.1inch
(height - 2 * thickness) / count
90deg - angle</code></pre><p>Numbers without a unit use the length unit set in the <a href="#docs/preferences">preferences</a>, or degrees for angles. Mixed units are converted automatically.</p><h3>Measures</h3><p>Click the tape measure button of a field and pick geometry to insert a live measure, like the length of an edge or the radius of a hole. Measures are shown as colored tokens and update whenever the geometry changes. See <a href="#docs/inspect/measuring">Measuring</a> for the available measures.</p><h3>Stepping values</h3><p>In numeric fields, press <kbd>↑</kbd> and <kbd>↓</kbd> to step the value. Hold <kbd>Shift</kbd> for steps ten times as large, <kbd>Alt</kbd> for steps a tenth of the size.</p><h2 id="variants">Variants</h2><p>Choose <strong>Construct › Variant</strong> to add a variant to the active component. It starts with <strong>Option 1</strong>, which stores the current values of all parameters.</p><ul><li>Use <strong>+</strong> to add an option with the current values, and <strong>−</strong> to delete the active one.</li><li>Pick an option from the dropdown to apply its values and update the model.</li><li>Changing a parameter updates the stored value of the active option.</li><li>Expand the variant in the tree to rename the active option.</li></ul><p>When you place a document in another one, the variant to use can be chosen in the <a href="#docs/components/place">Place</a> feature. This makes variants ideal for standard parts like screws in different sizes.</p>`,20)]))}const Z2={},G2=lt(Z2,[["render",V2]]);function q2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Materials</h1><p class="lead">Materials define how a component looks and how it behaves physically. They are used to compute weights and centers of mass, as input for simulations, and for realistic rendering.</p><h2 id="assigning">Assigning a material</h2><p>Activate a component and choose <strong>Simulate › Material</strong>. The component gets a material, shown in its tree entry. Components without a material of their own inherit their parent&#39;s material, so assigning one to an assembly covers all of its parts.</p><p>Expand the material in the tree to choose a different material from the document&#39;s list, or click <strong>+</strong> to create an editable copy of the current material. The trash icon removes the assignment.</p><h2 id="properties">Physical properties</h2><div class="table-wrap"><table><thead><tr><th>Property</th><th>Used for</th></tr></thead><tbody><tr><td>Density (g/cm³)</td><td>Weight and center of mass</td></tr><tr><td>Elastic modulus (MPa)</td><td>Stiffness in static simulations</td></tr><tr><td>Poisson ratio</td><td>Lateral contraction in static simulations</td></tr><tr><td>Yield strength (MPa)</td><td>Stress at which the material starts to deform permanently. Leave at 0 for brittle materials.</td></tr><tr><td>Ultimate strength (MPa)</td><td>Stress at which the material breaks</td></tr></tbody></table></div><h2 id="appearance">Visual properties</h2><ul><li><strong>Color</strong></li><li><strong>Metal</strong> switches between metallic and non-metallic surfaces.</li><li><strong>Roughness</strong> goes from mirror-like to matte.</li><li><strong>Emission</strong> makes the material glow.</li><li><strong>Transparency</strong>, with a <strong>Refractive Index</strong> for transparent materials (about 1.5 for glass).</li><li><strong>Clear Coat</strong> adds a glossy top layer, like car paint.</li></ul><p>Visual properties are best judged with <a href="#docs/viewport/display">path traced</a> shading. Switch the display to <strong>Component Colors</strong> to see components by color instead of material.</p><h2 id="mass">Weight &amp; center of mass</h2><p>Select a solid or component to see its weight in the info box. The <strong>Centroid</strong> helper marks the center of mass. See <a href="#docs/assemblies/mass-properties">Mass properties</a>.</p>',12)]))}const Y2={},K2=lt(Y2,[["render",q2]]);function X2(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Assemblies &amp; Joints</h1><p class="lead">Any component that contains other components is an assembly. Joints, rigid groups and motion links define how its parts can move relative to each other, so you can drag your virtual prototype through its range of motion right in the viewport.</p><p>The assembly tools are found on the <strong>Simulate</strong> tab of the toolbar: <strong>Joint</strong>, <strong>Group</strong> and <strong>Motion Link</strong>. Like every other operation, they are recorded in the <a href="#docs/history">parametric history</a> and can be edited later.</p><h2 id="joints">Joints</h2><p>Choose <strong>Joint</strong> and pick the two inputs labeled <strong>1</strong> and <strong>2</strong>. When the joint is created, part 2 is moved onto part 1&#39;s axis, plane or point, keeping all of its free motions. Both inputs have to lie on different components below the assembly that owns the joint.</p><div class="table-wrap"><table><thead><tr><th>Type</th><th>Inputs</th><th>Free motions</th></tr></thead><tbody><tr><td>Axis</td><td>Two cylindrical faces</td><td>Rotate Z and Slide Z. With <strong>Lock Slide</strong> enabled only Rotate Z remains, like a hinge or shaft in a bearing.</td></tr><tr><td>Coplanar</td><td>Two planar faces</td><td>Slide X, Slide Y and Rotate Z. The faces stay flat against each other.</td></tr><tr><td>Ball</td><td>Two points</td><td>Rotate X, Rotate Y and Rotate Z around a common point.</td></tr><tr><td>Fix</td><td>One component</td><td>None. Fixes the component in place, which is how you ground an assembly.</td></tr></tbody></table></div><h3>Lock Slide and Offset</h3><p>Axis joints can slide along their axis by default. Turn on <strong>Lock Slide</strong> to prevent that, and use <strong>Offset</strong> to set the locked position along the axis.</p><h3>Rest pose</h3><p>The rest pose is where part 2 sits relative to the aligned position when nothing is dragging it. Depending on the joint type you can set <strong>Rest Angle</strong>, <strong>Rest Slide</strong>, <strong>Rest X</strong> / <strong>Rest Y</strong> (Coplanar) or <strong>Rest Tilt X</strong> / <strong>Rest Tilt Y</strong> (Ball).</p><h3>Limits</h3><ul><li><strong>Limit Angle</strong> (Axis, Coplanar) restricts rotation between <strong>Min Angle</strong> and <strong>Max Angle</strong> (default -90° to 90°).</li><li><strong>Limit Slide</strong> restricts sliding between <strong>Min Slide</strong> and <strong>Max Slide</strong> on Axis joints, or between <strong>Min X</strong> / <strong>Max X</strong> and <strong>Min Y</strong> / <strong>Max Y</strong> on Coplanar joints.</li><li><strong>Limit Tilt</strong> (Ball) restricts how far the ball can tilt from its rest direction with <strong>Max Tilt</strong> (default 45°).</li></ul><p>If the rest pose lies outside the limits, the joint shows a warning.</p><h3>Joint markers</h3><p>Every joint draws a round marker at its attachment point in the viewport. Click a marker to select the joint, double-click it to edit the joint&#39;s settings.</p><h2 id="groups">Rigid groups</h2><p><strong>Group</strong> locks two or more components together in their current relative positions, without moving any of them. Use it for parts that are bolted or welded together but modeled as separate components.</p><h2 id="motion-links">Motion links</h2><p>A <strong>Motion Link</strong> couples one motion of a joint to one motion of another joint, as in gears, a rack and pinion or a lead screw.</p><ul><li>Pick <strong>Joint 1</strong> and <strong>Joint 2</strong> by clicking their markers.</li><li>Choose <strong>Motion 1</strong> and <strong>Motion 2</strong> from the free motions of each joint, like <em>Rotate Z</em> or <em>Slide Z</em>.</li><li><strong>Travel 1</strong> and <strong>Travel 2</strong> set the ratio: when motion 1 travels its amount, motion 2 travels its amount. Rotations are given as angles, slides as lengths.</li><li><strong>Reverse</strong> flips the direction of the coupling.</li></ul><h2 id="dragging">Dragging &amp; posing</h2><p>Drag any part with the regular selection tool. A kinematic solver moves it while honoring all joints, limits, motion links, rigid groups and fixed components, including closed loops. If a target can&#39;t be reached, the linkage stays intact instead of being pulled apart.</p><p>Selecting components also shows a move/rotate gizmo, which goes through the same solver. With several components selected, they move together as a block.</p><p>After dragging, a <strong>Pose</strong> panel appears in the side bar. <strong>Keep</strong> records a <strong>Pose</strong> feature in the history, so the new positions are kept. <strong>Reset</strong> returns the parts to their design positions. Poses that are not accepted are reset whenever the model rebuilds.</p><div class="note">Parts pass through each other while dragging. Use the <a href="#docs/inspect/interference">Interference</a> tool to check an assembly for collisions.</div><h2 id="mass-properties">Mass properties</h2><p>Select a solid or component to see its <strong>Weight</strong>, <strong>Volume</strong> and <strong>Surface Area</strong> in the info box at the bottom right of the window. Weight requires a <a href="#docs/materials">material</a>. Selecting several items sums their values.</p><p>To locate the center of mass, use <strong>Construct › Centroid</strong>. It adds a <strong>Centroid</strong> helper at the component&#39;s center of mass (weighted by mass if all bodies have materials, otherwise by volume). Hover it in the tree to read its coordinates. The centroid can be used as a reference point in other features. If those features in turn change the mass distribution, ProtoSolid solves the position iteratively until it is within the <strong>Center of mass deviation</strong> set in the preferences.</p><p>To animate an assembly over time, continue with <a href="#docs/animation">Animation</a>.</p>',29)]))}const J2={},Q2=lt(J2,[["render",X2]]);function ty(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Animation</h1><p class="lead">Animations bring an assembly to life with keyframed motion. All joints and limits are respected during playback, so you can watch your mechanism run and trace the paths its points take.</p><h2 id="creating">Creating an animation</h2><p>Choose <strong>Simulate › Animation</strong>. An <strong>Animation</strong> item appears in the tree, showing its duration. Expand it to set:</p><ul><li><strong>Duration (s)</strong>: length of the animation, 4 seconds by default.</li><li><strong>Loop</strong>: start over when the end is reached.</li></ul><p>While the animation is open, the animation bar replaces the feature bar at the bottom of the window. Closing the animation returns the assembly to the pose it had before.</p><h2 id="keyframes">Setting keyframes</h2><ol><li>Move the playhead to a point in time by clicking or dragging on the ruler. Scrubbing snaps to 0.1 s.</li><li>Move components in the viewport by dragging them or using the gizmo. Each moved component shows up as a row, in italics with a dot until it is keyframed.</li><li>Click the key button to <strong>keyframe moved components</strong>. With nothing moved, the button keyframes all tracks at the current time.</li></ol><p>A new track automatically gets a keyframe at time 0 holding the starting pose. Only components below the animation&#39;s own component can be animated. Keyframes are stored relative to the parent, so nested parts follow their parents.</p><h3>Editing keyframes</h3><ul><li>Click a keyframe to jump to it, drag it to retime it.</li><li>Press <kbd>Delete</kbd> or <kbd>Backspace</kbd> to remove the selected keyframe.</li><li>Double-click a keyframe to cycle its easing.</li><li>Use a row&#39;s trash icon to delete its track, or to put a moved but not yet keyframed component back where it was.</li></ul><h3>Easing</h3><div class="table-wrap"><table><thead><tr><th>Easing</th><th>Marker</th><th>Behavior</th></tr></thead><tbody><tr><td>Linear</td><td>Diamond</td><td>Constant speed between keyframes.</td></tr><tr><td>Smooth</td><td>Circle</td><td>Smooth tangents that ease in and out at the ends of a track.</td></tr><tr><td>Step</td><td>Square</td><td>Holds the value until the next keyframe.</td></tr></tbody></table></div><h2 id="playback">Playback</h2><p>The transport buttons jump to the start, previous keyframe, play/pause, next keyframe and end. The time display shows the current time and the total duration.</p><h2 id="motion-traces">Motion traces</h2><p>With an animation open, click a point on an animated part to trace it. During playback a colored trail is drawn along the path of that point. Click the point again to remove the trace. This is a quick way to check the path of a linkage or the clearance of a moving part.</p><div class="note">Animations are purely kinematic: components move along keyframed positions under the constraints of their joints. There are no physics or time-based drivers.</div>',18)]))}const ey={},ny=lt(ey,[["render",ty]]);function ry(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Inspect &amp; Measure</h1><p class="lead">The tools on the <strong>Inspect</strong> tab help you analyze your design: find collisions between parts, check the quality of curves and surfaces, verify draft angles and look inside your model.</p><h2 id="measuring">Measuring</h2><p>Select any geometry to read its measurements in the info box at the bottom right of the window:</p><ul><li><strong>Solids and components</strong>: Weight, Volume and Surface Area.</li><li><strong>Faces</strong>: Surface Area.</li><li><strong>Edges</strong>: Length. A circular edge also shows Radius and Diameter.</li><li><strong>Sketch circles</strong>: Radius, Diameter, Circumference and Area. <strong>Arcs</strong>: Radius and Length.</li></ul><p>When several items are selected, their values are summed.</p><h3>Measures in expressions</h3><p>Every numeric input of a feature can refer to measured values of existing geometry. Pick an item while editing the expression and its measure is inserted as a colored token, which updates whenever the geometry changes. A menu on the token lets you choose which property to use:</p><div class="table-wrap"><table><thead><tr><th>Geometry</th><th>Available measures</th></tr></thead><tbody><tr><td>Vertex, point</td><td>X, Y, Z</td></tr><tr><td>Edge</td><td>Length. Circular edges add Radius, Diameter, Angle (arcs) and the X, Y, Z of their center.</td></tr><tr><td>Face</td><td>Area, Perimeter. Cylinders and spheres add Radius and Diameter. All faces offer the X, Y, Z of their center.</td></tr><tr><td>Solid</td><td>Volume, Surface Area and the X, Y, Z of its center.</td></tr><tr><td>Sketch line</td><td>Length, Angle</td></tr><tr><td>Sketch circle</td><td>Radius, Diameter, Circumference, Area, Center</td></tr><tr><td>Sketch arc</td><td>Radius, Diameter, Arc Length, Angle, Center</td></tr></tbody></table></div><p>Values are given in millimeters and degrees. See <a href="#docs/parameters">Parameters &amp; Expressions</a> for more on expressions.</p><h2 id="interference">Interference</h2><p><strong>Interference</strong> checks every pair of parts in the active assembly for overlaps. Overlapping volumes are highlighted in red and listed under <strong>Collisions</strong> together with their volume in cm³.</p><h2 id="curvature">Curvature</h2><p><strong>Curvature</strong> draws curvature combs that reveal how smoothly an edge or curve bends. Click a curve to toggle its comb, or click a face to toggle the combs of all of its curved edges. The tightest point of each comb is labeled with its minimum radius. Hover the comb to read the radius at any point.</p><ul><li><strong>Scale</strong> sets the length of the comb&#39;s teeth.</li><li><strong>Samples</strong> sets how many teeth are drawn per curve.</li></ul><p>In sketch mode, the curvature checkbox in the tool options shows combs for the selected splines.</p><h2 id="diagnostic-shading">Diagnostic Shading</h2><p><strong>Diagnostic Shading</strong> replaces the regular rendering with one of two analysis modes:</p><ul><li><strong>Zebra Stripes</strong> reflect a striped pattern on the surfaces. Stripes that run smoothly across an edge show a smooth transition between faces, kinks reveal breaks in tangency or curvature. <strong>Frequency</strong> sets the number of stripes.</li><li><strong>Draft Angle</strong> colors faces by their angle to the pull direction (<strong>Top</strong>, <strong>Front</strong> or <strong>Side</strong>), from green over yellow at 45° to red at 90° and beyond. Hover a face to read its draft angle. Use it to check parts for molding or casting.</li></ul><h2 id="section-views">Section views</h2><p><strong>Section View</strong> cuts away part of the model, so you can see inside. Each section appears in the tree as <strong>Section 1</strong>, <strong>Section 2</strong> and so on, with a visibility toggle.</p><p>Expand a section to edit its <strong>Position</strong> and <strong>Orientation</strong>, or drag the gizmo in the viewport. <strong>Side</strong> flips which half is kept. Cut faces are drawn with solid caps, and several visible sections combine. Section views can be stored with saved <a href="#docs/viewport/views">views</a>.</p>',22)]))}const oy={},sy=lt(oy,[["render",ry]]);function iy(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Simulation</h1><p class="lead">ProtoSolid comes with built-in solvers for static stress, heat transfer and fluid flow. Studies update automatically in the background whenever you change your model, so you can see the effect of every design change in seconds.</p><h2 id="workflow">Setting up a study</h2><ol><li>Choose <strong>Static Load</strong>, <strong>Heat Flow</strong> or <strong>Fluid Flow</strong> from the <strong>Simulate</strong> tab. The study is added to the component&#39;s tree and opened.</li><li>Pick faces for the first set of boundary conditions. The first picker opens automatically. Click faces in the viewport to add or remove them. Once the first set is picked, the second picker opens. Right-click a picker to clear it.</li><li>Enter the loads, temperatures or flow conditions.</li></ol><p>All faces of a study have to lie on a single solid. The solid is meshed automatically on a voxel grid, so there is no meshing step to prepare. The solver runs whenever the inputs or the model change, showing a progress bar. Problems with the setup appear in a warning bar.</p><p>While a study is open, hover the model to probe the result at any point. Collapse the study in the tree to return to the regular view.</p><h2 id="static-load">Static Load</h2><p>Computes stress and deformation of a part under a static load.</p><ul><li><strong>Fixed faces</strong> are held in place.</li><li><strong>Loaded faces</strong> receive the force given by <strong>Force X</strong>, <strong>Force Y</strong> and <strong>Force Z</strong> in Newtons.</li><li><strong>Quality</strong> (1–5) refines the solver grid and the displayed mesh. Higher settings are more accurate but take longer.</li></ul><p>The component needs a <a href="#docs/materials">material</a> with an elastic modulus and Poisson ratio. Its yield and ultimate strength are used to evaluate the result.</p><h3>Results</h3><ul><li>Faces are colored by von Mises stress.</li><li>The deformed shape is shown exaggerated, so deformation is visible even on stiff parts. <strong>Play deformation</strong> in the tree animates between the undeformed and deformed shape.</li><li>The <strong>stress legend</strong> next to the study runs from blue to red across the elastic range. A yellow band marks stresses between yield and ultimate strength, where the part deforms permanently, and white marks failure.</li><li><strong>Safety factor</strong> is the material&#39;s limit divided by the peak stress. Below 1 the part will deform permanently or break.</li><li><strong>Max displacement</strong> gives the largest deformation in millimeters.</li><li><strong>Solver residual</strong> indicates how well the solver converged. Values above 0.1% are highlighted.</li></ul><p>The probe shows stress in MPa and displacement in mm.</p><h2 id="heat-flow">Heat Flow</h2><p>Computes the steady-state temperature distribution in a part that is heated on some faces and cooled on others.</p><ul><li><strong>Cold faces</strong> are held at <strong>Cold °C</strong> (20 °C by default).</li><li><strong>Hot faces</strong> are held at <strong>Hot °C</strong> (100 °C by default).</li></ul><p>Faces are colored from cold to hot, and arrows show the direction of heat flow. The probe shows the temperature at the cursor.</p><h2 id="fluid-flow">Fluid Flow</h2><p>Computes incompressible flow through a channel. Model the fluid itself as a solid, for example the inside of a duct or manifold, and pick faces on it:</p><ul><li><strong>Inlet faces</strong> receive fluid at <strong>Inlet m/s</strong>.</li><li><strong>Outlet faces</strong> are held at <strong>Outlet Pa gauge</strong>.</li><li>All other faces act as walls.</li></ul><p>Choose the <strong>Fluid</strong> from <strong>Air (20 °C)</strong>, <strong>Water (20 °C)</strong>, or enter a custom <strong>Density</strong> and <strong>Viscosity</strong>. <strong>Grid cells</strong> (8–64) sets the resolution of the solver grid.</p><p><strong>Flow vectors</strong> show arrows colored by speed, <strong>Flow lines</strong> trace streamlines from the inlets. The probe shows speed and pressure at the cursor.</p><div class="note">If the solver reports that the volume or an inlet is too thin for the grid, increase <strong>Grid cells</strong>.</div><h2 id="units">Units</h2><div class="table-wrap"><table><thead><tr><th>Quantity</th><th>Unit</th></tr></thead><tbody><tr><td>Force</td><td>N</td></tr><tr><td>Stress</td><td>MPa</td></tr><tr><td>Displacement</td><td>mm</td></tr><tr><td>Temperature</td><td>°C</td></tr><tr><td>Speed</td><td>m/s</td></tr><tr><td>Pressure</td><td>Pa (gauge)</td></tr><tr><td>Fluid density</td><td>kg/m³</td></tr><tr><td>Viscosity</td><td>Pa·s</td></tr></tbody></table></div>',25)]))}const ay={},ly=lt(ay,[["render",iy]]);function cy(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>CAM</h1><p class="lead">Generate 3-axis milling toolpaths directly from your parts. Face, rough, contour, finish and drill in stages, watch the cut in a material removal simulation and post G-code for GRBL or LinuxCNC.</p><h2 id="setup">Creating a setup</h2><p>Activate the component you want to machine and choose <strong>Tools › Manufacture</strong>. A <strong>Setup</strong> is added to the tree and opened. While a setup is open, the <strong>Milling</strong> tab appears in the toolbar and the CAM bar replaces the feature bar.</p><h3>Stock</h3><div class="table-wrap"><table><thead><tr><th>Setting</th><th>Description</th></tr></thead><tbody><tr><td>Facing Spindle</td><td>Side of the part that faces the spindle: +Y, -Y, +Z, -Z, +X or -X.</td></tr><tr><td>Work Zero</td><td>Point the machine is zeroed on: <strong>Top front left corner</strong> or <strong>Top center</strong>.</td></tr><tr><td>Offset (mm)</td><td>Material around the part.</td></tr><tr><td>Clamp Height (mm)</td><td>Material below the part, held by the vise. The tool always stays above it.</td></tr><tr><td>Stock Size (mm)</td><td>The resulting size of the block to clamp into the vise.</td></tr><tr><td>Quality</td><td>Refines the toolpaths and the simulated stock (1–5).</td></tr></tbody></table></div><h2 id="operations">Operations</h2><p>Add operations from the <strong>Milling</strong> tab. They are sorted in machining order. Each operation defines its own tool, and tool numbers (T1, T2, …) are assigned automatically, with operations using the same tool sharing its number.</p><div class="table-wrap"><table><thead><tr><th>Operation</th><th>What it does</th></tr></thead><tbody><tr><td>Face</td><td>Zigzag passes that bring the stock down to the top of the part.</td></tr><tr><td>Rough</td><td>Zigzag passes in layers down to the
