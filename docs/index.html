 floor, clearing bulk material and leaving <strong>Stock to Leave</strong> for finishing.</td></tr><tr><td>Contour</td><td>Waterline passes around the outlines of the part at each level, climb milling.</td></tr><tr><td>Finish</td><td>A single zigzag pass following the surface, typically with a ball end mill.</td></tr><tr><td>Drill</td><td>Peck-drills round holes that are aligned with the spindle. Holes are found automatically. <strong>Holes</strong> shows how many of the detected holes fit the drill&#39;s diameter.</td></tr></tbody></table></div><p>Depending on the operation, these settings are available:</p><ul><li><strong>Tool</strong>: Flat end mill or Ball end mill, and <strong>Tool Ø (mm)</strong>.</li><li><strong>Direction</strong>: Along X, Along Y, or Along X and Y.</li><li><strong>Stepover</strong> and <strong>Stepdown</strong>: distance between passes and layers.</li><li><strong>Peck Depth</strong> for drilling.</li><li><strong>Stock to Leave</strong>: material left on the part for a later operation.</li><li><strong>Feed</strong>, <strong>Plunge</strong> (mm/min) and <strong>Spindle</strong> (rpm).</li></ul><p>In the viewport, feed moves are shown in blue and rapid moves in red.</p><h2 id="simulation">Simulating the cut</h2><p>Press <strong>Simulate machining</strong> in the CAM bar to watch the tool remove material from the stock. The operations strip shows every operation sized by its machining time. Click or drag on it to scrub, or jump between operations with the arrow buttons. The speed slider runs the simulation from 1× up to 1000× real time, and the time readout shows elapsed and total machining time. <strong>Show toolpaths</strong> returns to the toolpath view.</p><h2 id="post-processing">Exporting G-code</h2><p>In the setup&#39;s <strong>Post Processing</strong> section:</p><ul><li>Choose the <strong>Controller</strong>: <strong>GRBL</strong> or <strong>LinuxCNC</strong>.</li><li>Choose a <strong>Destination Path</strong> for the <code>.nc</code> file.</li><li>Turn on <strong>Export on Save</strong> to write the G-code whenever you save the document.</li></ul><p>Export the program with the <strong>Export G-code</strong> button in the setup&#39;s header. Output is in millimeters. For GRBL, tool changes pause the program and ask you to change tools and re-zero Z on the stock top. LinuxCNC programs use regular <code>M6</code> tool changes with tool length offsets.</p><div class="note warn">Always check generated programs in a dry run before cutting material.</div>',19)]))}const dy={},uy=lt(dy,[["render",cy]]);function fy(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Drawings</h1><p class="lead">Derive production-ready technical drawings from your parts, with projected, section, detail and auxiliary views on ISO sheets. Annotate them with dimensions, hole callouts and GD&amp;T, and export to PDF or SVG. Drawings stay linked to the model and update when it changes.</p><h2 id="creating">Creating a drawing</h2><p>Activate a component and choose <strong>Tools › Drawing</strong>. The sheet editor opens with front, top and side views plus an isometric view already laid out, at the largest standard scale that fits the sheet.</p><p>In drawing mode, the toolbar shows the <strong>Views</strong>, <strong>Annotate</strong> and <strong>Symbols</strong> tabs. Zoom the sheet with the mouse wheel, pan with the right mouse button (or <kbd>Shift</kbd>/<kbd>Ctrl</kbd> + left-drag), and double-click empty space to reset the zoom.</p><h3>Drawing settings</h3><div class="table-wrap"><table><thead><tr><th>Setting</th><th>Options</th></tr></thead><tbody><tr><td>Sheet</td><td>ISO A4, A3, A2, A1 or A0, landscape.</td></tr><tr><td>Scale</td><td>Standard scales from 10:1 to 1:1000.</td></tr><tr><td>Projection</td><td>First Angle or Third Angle.</td></tr><tr><td>Hidden Lines</td><td>Show hidden edges as dashed lines.</td></tr><tr><td>Format</td><td>PDF or SVG.</td></tr><tr><td>Destination Path, Export on Save</td><td>Where to export the drawing, and whether to do so automatically on save.</td></tr></tbody></table></div><h3>Title block</h3><p>Fill in <strong>Part No.</strong>, <strong>Material</strong>, <strong>Drawn by</strong> and <strong>Revision</strong>. The title block also shows the component&#39;s name, the scale, the sheet size and the projection method. Material defaults to the component&#39;s material.</p><h2 id="views">Views</h2><div class="table-wrap"><table><thead><tr><th>Tool</th><th>How to use</th></tr></thead><tbody><tr><td>Move</td><td>Drag views, annotations and break lines. Derived views slide along their alignment axis. <kbd>Delete</kbd> removes the selection, including views derived from a deleted view. Double-click an annotation to edit it.</td></tr><tr><td>Base View</td><td>Click on the sheet and choose Front, Back, Top, Bottom, Left, Right or Isometric.</td></tr><tr><td>Projected View</td><td>Pick a view, then click to its left, right, top or bottom.</td></tr><tr><td>Section View</td><td>Pick a view, click the start and end of the cutting line, then place the view. The cut is hatched and labeled <em>SECTION A-A</em>.</td></tr><tr><td>Detail View</td><td>Pick a view, click a center and a radius, then place the enlarged view.</td></tr><tr><td>Broken View</td><td>Pick a view and click two points to remove the band between them, shortening long parts.</td></tr><tr><td>Auxiliary View</td><td>Pick a straight edge in a view, then place a view looking straight at it.</td></tr></tbody></table></div><p>View letters (A, B, C, …) are assigned automatically.</p><h2 id="annotations">Annotations</h2><div class="table-wrap"><table><thead><tr><th>Tool</th><th>How to use</th></tr></thead><tbody><tr><td>Dimension <kbd>D</kbd></td><td>Pick a line for its length, a circle for its diameter, an arc for its radius, or two items for their distance or angle. Placing the dimension decides between horizontal, vertical and aligned.</td></tr><tr><td>Angle</td><td>Pick two lines.</td></tr><tr><td>Baseline</td><td>Pick a base point and further points to create stacked dimensions from a common baseline.</td></tr><tr><td>Ordinate</td><td>Pick an origin and further points. Each point is labeled with its distance from the origin.</td></tr><tr><td>Centerline</td><td>Pick two lines or two points to draw a centerline between them.</td></tr><tr><td>Center Mark</td><td>Pick a circle.</td></tr><tr><td>Note</td><td>Optionally pick a leader target, then place the note and type. <kbd>Shift</kbd>+<kbd>Enter</kbd> adds a line.</td></tr><tr><td>Hole Callout</td><td>Pick a circular edge. The callout text, like <em>Ø6 THRU</em>, is generated automatically.</td></tr><tr><td>Balloon</td><td>Pick a part to label it with its item number.</td></tr></tbody></table></div><h2 id="symbols">Symbols</h2><div class="table-wrap"><table><thead><tr><th>Tool</th><th>How to use</th></tr></thead><tbody><tr><td>Surface Finish</td><td>Pick an edge and enter the roughness, like <em>Ra 3.2</em>.</td></tr><tr><td>Geometric Tolerance</td><td>Choose a characteristic (flatness, position, runout, …), pick a target and place the feature control frame. Then enter the tolerance and datums, like <em>A B C</em>.</td></tr><tr><td>Datum</td><td>Pick a target and place a datum symbol. Letters are assigned automatically.</td></tr><tr><td>Weld</td><td>Pick a target and place a weld symbol of type Fillet, Square Butt or V Butt.</td></tr><tr><td>Tolerance</td><td>Click a dimension to add a tolerance, like <em>±0.1</em>, <em>+0.1/-0.05</em> or a fit like <em>H7</em>.</td></tr></tbody></table></div><p>While editing values, <kbd>Tab</kbd> moves between fields, <kbd>Enter</kbd> confirms and <kbd>Esc</kbd> cancels.</p><h2 id="export">Exporting</h2><p>Click the export icon in the drawing&#39;s header to write a PDF or SVG file. If no destination is set yet, you are asked for one first. With <strong>Export on Save</strong> enabled, the drawing is exported whenever you save the document.</p>',19)]))}const hy={},py=lt(hy,[["render",fy]]);function gy(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Files &amp; Exchange</h1><p class="lead">ProtoSolid saves documents in its own <code>.cad</code> format and exchanges geometry with other applications through STEP, STL, 3MF, DXF, PDF, SVG and G-code.</p><h2 id="documents">Documents</h2><p><strong>Save</strong> <kbd>Ctrl</kbd>+<kbd>S</kbd> writes the document to a <code>.cad</code> file, which contains the complete parametric history and, for versioned documents, every saved version. <strong>Open...</strong> <kbd>Ctrl</kbd>+<kbd>O</kbd> can open several documents at once, each in its own tab. Recently used documents are listed in the app menu.</p><p>Closing a tab with unsaved changes asks for confirmation. See <a href="#docs/versions">Versions &amp; Branches</a> for how saving works in versioned documents.</p><h2 id="import">Importing</h2><ul><li><strong>Import...</strong> <kbd>Ctrl</kbd>+<kbd>I</kbd> opens a STEP file (<code>.step</code>, <code>.stp</code>) in a new document.</li><li><strong>Construct › Place</strong> inserts a STEP file or another ProtoSolid document into the active component. See <a href="#docs/components/place">Placing files</a>.</li><li>Drop files onto the window: STEP files are placed into the active component, ProtoSolid documents can be opened or placed.</li></ul><p>STEP imports are exact BREP geometry, so you can continue modeling on imported parts, for example with <a href="#docs/edit-solid/move">Move</a> or <a href="#docs/edit-solid/dissolve">Dissolve</a>.</p><h2 id="quick-export">Quick export</h2><p><strong>Export...</strong> <kbd>Ctrl</kbd>+<kbd>E</kbd> exports the active component. Choose <strong>STEP</strong>, <strong>STL</strong> or <strong>3MF</strong> in the save dialog.</p><h2 id="export-configs">Export configurations</h2><p>For files you export repeatedly, choose <strong>Tools › Export</strong>. This adds an export configuration to the component&#39;s tree, which remembers its format, settings and destination. Click its export icon to write the file, or enable <strong>Export on Save</strong> to update the file every time you save the document.</p><div class="table-wrap"><table><thead><tr><th>Setting</th><th>Formats</th><th>Description</th></tr></thead><tbody><tr><td>Format</td><td></td><td>STL, 3MF or STEP.</td></tr><tr><td>Max Deviation</td><td>STL, 3MF</td><td>Maximum distance between the mesh and the exact surface, in mm.</td></tr><tr><td>Max Angular Deviation</td><td>STL, 3MF</td><td>Maximum angle between neighboring mesh facets, in degrees.</td></tr><tr><td>Structure</td><td>STEP</td><td><strong>Assembly</strong> keeps the component structure, <strong>Flat Assembly</strong> places every component directly in the root, <strong>Single Part</strong> merges all bodies into one product.</td></tr><tr><td>Units</td><td>STEP</td><td>Millimeters or Inches.</td></tr><tr><td>Include Hidden</td><td>STEP</td><td>Export hidden components and bodies.</td></tr><tr><td>Colors</td><td>STEP</td><td>Export component colors.</td></tr></tbody></table></div><p>While a mesh export configuration is expanded, the viewport previews the resulting mesh, so you can tune the deviation settings for 3D printing.</p><h2 id="formats">Format overview</h2><div class="table-wrap"><table><thead><tr><th>Format</th><th>Use</th><th>Where</th></tr></thead><tbody><tr><td>.cad</td><td>ProtoSolid documents</td><td>Open, Save, Place</td></tr><tr><td>STEP</td><td>Exact geometry exchange with other CAD systems</td><td>Import, Export, Place, flat patterns</td></tr><tr><td>STL, 3MF</td><td>Meshes for 3D printing</td><td>Export</td></tr><tr><td>DXF</td><td>Sheet metal flat patterns for cutting</td><td><a href="#docs/sheet-metal/flat-pattern">Flatten</a></td></tr><tr><td>PDF, SVG</td><td>Technical drawings</td><td><a href="#docs/drawings/export">Drawings</a></td></tr><tr><td>G-code (.nc)</td><td>CNC milling programs</td><td><a href="#docs/cam/post-processing">CAM</a></td></tr><tr><td>PNG, JPEG, SVG, WebP, …</td><td>Reference images</td><td><a href="#docs/viewport/canvas">Canvas</a></td></tr></tbody></table></div>',16)]))}const my={},yy=lt(my,[["render",gy]]);function by(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Versions &amp; Branches</h1><p class="lead">ProtoSolid has version control built right into its documents. Every save records a version, and you can branch off to try ideas and merge them back later, all stored in a single <code>.cad</code> file.</p><h2 id="saving">Saving versions</h2><p>Versioned documents are the default. When you save, ProtoSolid asks you to describe what changed, and records the document as a new version on the current branch. Unchanged content is shared between versions, so files stay small.</p><p>To save documents without history, set <strong>Document format</strong> to <strong>Unversioned</strong> in the <a href="#docs/preferences">preferences</a>. Existing history is only dropped when you explicitly use <strong>Save as...</strong> with that setting.</p><h2 id="history-panel">The history panel</h2><p>Click the branch icon on the document&#39;s tab to open the history panel. It shows all versions as a graph, with a colored lane for each branch, the version messages and when they were saved.</p><ul><li>Click a branch label to switch to that branch. Double-click it to rename the branch.</li><li>Hover a version and click <strong>Open this version</strong> to look at an earlier state of the document.</li><li><strong>Start a new branch from this version</strong> creates a branch at any version.</li><li>Delete branches you no longer need. Versions that are not part of another branch are removed with them.</li></ul><p>Saving changes to an earlier version starts a new branch, so no work is ever overwritten. Switching versions with unsaved changes asks for confirmation first.</p><h2 id="merging">Merging</h2><p>Hover a version of another branch and choose <strong>Merge</strong> to bring its changes into the current branch. Save your changes before merging.</p><p>ProtoSolid compares the features of both branches and shows a merge preview. The toolbar is replaced by the merge panel, which lists every added, modified and removed feature, and the viewport shows the merged model live.</p><ul><li><strong>Conflicts</strong> occur when both branches changed the same setting, feature or order. Choose which side to keep for each conflict, or use <strong>Keep for all conflicts</strong>. Conflicts default to the current branch.</li><li>Optionally describe the merge, then click <strong>Merge</strong> to save it as a new version, or <strong>Cancel</strong>.</li><li>If the current branch has no changes of its own, the merge is a simple <strong>Fast-forward</strong>.</li></ul><p>The model can&#39;t be edited while the merge preview is open.</p>',14)]))}const vy={},wy=lt(vy,[["render",by]]);function ky(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>AI Agents</h1><p class="lead">ProtoSolid can let AI assistants work on your documents through the Model Context Protocol (MCP). Agents use the application like you do: they add features to the timeline, edit sketches and inspect the result, while you watch and stay in control.</p><h2 id="enabling">Enabling the MCP server</h2><ol><li>Open the <a href="#docs/preferences">settings</a> and go to <strong>AI Agents</strong>.</li><li>Turn on <strong>Enable MCP server</strong>. Optionally change the <strong>Port</strong> (3923 by default).</li><li>Copy the <strong>Server address</strong>, <code>http://127.0.0.1:3923/mcp</code>, and add it to your AI client as a <strong>streamable HTTP</strong> MCP server.</li></ol><p>The server only accepts connections from your own computer and is available in the desktop app only.</p><h2 id="capabilities">What agents can do</h2><div class="table-wrap"><table><thead><tr><th>Area</th><th>Capabilities</th></tr></thead><tbody><tr><td>Reading</td><td>Inspect the component tree, timeline, parameters, bodies with their faces and edges, sketches and feature settings. Capture images of the viewport.</td></tr><tr><td>Modeling</td><td>Create and edit features of every type, including sketches with constraints and dimensions, sheet metal and assembly features. Delete and reorder features and move the history marker.</td></tr><tr><td>Organizing</td><td>Create, activate and place components, set parameters, variants, materials, names, colors and visibility.</td></tr><tr><td>Analysis</td><td>Measure geometry, compute mass properties, run simulations and edit section views.</td></tr><tr><td>Output</td><td>Export files, edit and capture drawings, set up CAM.</td></tr><tr><td>History</td><td>Pose assemblies, manage saved views, read versions and manage branches.</td></tr></tbody></table></div><h2 id="control">Staying in control</h2><ul><li>Every change an agent makes is a regular feature in the timeline, and each one can be undone individually.</li><li>Agents work on the active document, one action at a time, and you see every change in the viewport.</li><li>Saving a new document or choosing a file location opens a dialog that waits for you.</li><li>Merges started by an agent open the merge preview, which you complete yourself.</li></ul><div class="note">A good way to start is to ask your assistant to describe the open document, then to make a small change, like adding a parameter or a fillet.</div>',10)]))}const _y={},Ly=lt(_y,[["render",ky]]);function xy(t,e){return F(),V("div",null,e[0]||(e[0]=[wt('<h1>Preferences</h1><p class="lead">Open the settings from the sliders button in the app menu, or with <kbd>Cmd</kbd>+<kbd>,</kbd> on macOS. Changes apply immediately. A few of them require a restart, which the settings window offers to do for you.</p><h2 id="appearance">Appearance</h2><div class="table-wrap"><table><thead><tr><th>Setting</th><th>Description</th></tr></thead><tbody><tr><td>Theme</td><td>Dark (default), Light, or match the system.</td></tr><tr><td>Anti-aliasing</td><td>Smooth jagged edges in the viewport. Requires a restart.</td></tr><tr><td>High-DPI rendering</td><td>Render the viewport at the display&#39;s native resolution.</td></tr><tr><td>Display shadows</td><td>Show a soft shadow below the model.</td></tr><tr><td>Blurred overlays</td><td>Blur the content behind floating controls.</td></tr><tr><td>Always show side bar labels</td><td>Show the labels of the view and display settings permanently, instead of on hover.</td></tr></tbody></table></div><h2 id="behaviour">Behaviour</h2><div class="table-wrap"><table><thead><tr><th>Setting</th><th>Description</th></tr></thead><tbody><tr><td>Preview on hover</td><td>Preview views, projection, shading and material options while hovering them.</td></tr><tr><td>Sketch camera</td><td>Move the camera when entering or leaving sketches: Off, Entering only, or Entering and leaving (default).</td></tr><tr><td>Timeline features</td><td>Show all features and dim unrelated ones (default), or show only features of the active component and its children.</td></tr><tr><td>Debug mode</td><td>Show detailed internal error messages when features fail.</td></tr></tbody></table></div><h2 id="files">Files</h2><div class="table-wrap"><table><thead><tr><th>Setting</th><th>Description</th></tr></thead><tbody><tr><td>Document format</td><td><strong>Versioned</strong> (default) records every save as a version, <strong>Unversioned</strong> saves only the current state. See <a href="#docs/versions">Versions &amp; Branches</a>.</td></tr><tr><td>Save debug info</td><td>Save documents as readable, uncompressed JSON.</td></tr></tbody></table></div><h2 id="units">Units</h2><div class="table-wrap"><table><thead><tr><th>Setting</th><th>Options</th></tr></thead><tbody><tr><td>Length</td><td>Millimeters (default), Centimeters, Meters or Inches. Used for numbers entered without a unit.</td></tr><tr><td>Angle</td><td>Degrees (default) or Radians.</td></tr><tr><td>Density</td><td>g/cm³ (default) or kg/m³.</td></tr></tbody></table></div><h2 id="tolerances">Tolerances</h2><div cla
