<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>ProtoSolid</title>
    <style type="text/css" media="screen">
      @font-face {
        font-family: 'Comfortaa';
        src: url('fonts/comfortaa.woff2') format('woff2');
      }

      body {
        margin: 0;
      }

      .splash-box {
        background: rgb(48,48,55);
        position: relative;
        border-radius: 12px;
        padding: 30px;
        width: 100%;
        height: 100%;
        color: white;
        font-family: 'Comfortaa';
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .logo {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 36px;
        margin: 0;
      }
      .version {
        font-size: 12px;
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 4px 8px;
        background: rgba(48,48,55, 0.7);
        border-radius: 3px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="splash-box">
      <img class="logo" src="logo.png" alt="" draggable="false">
      <h1>ProtoSolid</h1>
      <span class="version">Version 0.11</span>
    </div>
  </body>
</html>
