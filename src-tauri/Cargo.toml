[package]
name = "protosolid"
description = "Parametric CAD"
authors = ["Björn Breitgoff <syntheticore@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools", "macos-private-api"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
